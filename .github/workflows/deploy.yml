name: Deploy marketplace

# Every push to main republishes market.mtabari.com.ge. Modelled on the API repo's workflow: the
# build happens on the box against a freshly fetched main, so this job only triggers it and reports
# back, and the SSH key it uses is pinned to a single command server-side and can do nothing else.
#
# One-time server setup is in deploy/README.md. Until that is done this workflow will fail at the
# ssh step, which is the correct way round: a deploy that cannot run is better than a deploy key
# that can do anything.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys queue rather than overlap, and a superseded one still runs -- the server resets to
# whatever main is at the moment it builds, so cancelling could strand a commit undeployed.
concurrency:
  group: marketplace-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish on the server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::Set the SSH_HOST and SSH_PRIVATE_KEY repository secrets first."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Pin the host key when it is available, so a hijacked IP cannot collect the deploy key.
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set; trusting the key the host offers now."
            ssh-keyscan -t ed25519 "${SSH_HOST}" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          # The command is ignored by the server's forced command -- it is passed so the reason for
          # the deploy shows up in the server's own log next to the build output.
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${SSH_USER:-root}@${SSH_HOST}" \
            "deploy-market ${GIT_SHA} (${GITHUB_ACTOR} via ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER})"

      - name: Check the site is serving
        run: |
          set -euo pipefail
          # The last two are client-side routes with no file behind them: they prove nginx is
          # falling back to the app shell, without which every shared link and the address BOG
          # returns a buyer to would 404.
          fail=0
          for path in "/" "/listing/1" "/checkout/success"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://market.mtabari.com.ge${path}" || echo "000")
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || fail=1
          done
          exit "${fail}"
