# nginx site for the marketplace SPA — market.mtabari.com.ge
#
# Static files only. The API it talks to is the existing one on mtabari.com.ge, reached directly
# from the browser (VITE_API_URL is baked into the bundle at build time), so nothing is proxied
# here. The API already sends permissive CORS headers, which is what lets a different subdomain
# call it.
#
# Install as /etc/nginx/sites-available/market.mtabari.com.ge, symlink into sites-enabled, then
# run certbot for the certificate — certbot rewrites this file to add the :443 block and the
# http→https redirect, exactly as it did for the apex domain.

server {
    listen 80;
    listen [::]:80;

    server_name market.mtabari.com.ge;

    root /var/www/market.mtabari.com.ge;
    index index.html;

    # The app uses BrowserRouter, so /listing/47 and /checkout/success are client-side routes with
    # no file behind them. Without this fallback they 404 on reload and on any shared link — which
    # includes the address BOG sends a buyer back to after paying.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these, so a given name always holds the same bytes and can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The one file that must not be cached: it names the current hashed bundles, so a stale copy
    # keeps serving the previous deploy long after it is gone.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/market.access.log;
    error_log  /var/log/nginx/market.error.log;
}
