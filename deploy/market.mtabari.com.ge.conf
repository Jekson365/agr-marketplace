# nginx site for the marketplace SPA — market.mtabari.com.ge
#
# Until this file is installed and enabled, nginx has no server block matching this hostname and
# falls through to the default vhost: market.mtabari.com.ge serves the main site's content, and
# presents the apex certificate, which is why HTTPS fails with a name mismatch. Installing this and
# reloading fixes both at once; certbot then replaces the plain :80 block below.
#
# Static files only. The API lives on mtabari.com.ge and is called straight from the browser
# (VITE_API_URL is compiled into the bundle), so nothing is proxied here. The API already sends
# permissive CORS headers, which is what lets a different subdomain call it.
#
# Install:
#   cp market.mtabari.com.ge.conf /etc/nginx/sites-available/market.mtabari.com.ge
#   ln -sf /etc/nginx/sites-available/market.mtabari.com.ge /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d market.mtabari.com.ge --agree-tos --redirect -m you@example.com
#
# certbot rewrites this file in place: it adds a `listen 443 ssl` block carrying everything below,
# points it at the issued certificate, and turns this :80 block into a redirect. Everything in the
# `--- shared ---` section therefore ends up on the HTTPS side, which is where it is wanted.

server {
    listen 80;
    listen [::]:80;

    server_name market.mtabari.com.ge;

    # --- shared ---

    root /var/www/market.mtabari.com.ge;
    index index.html;

    # HSTS: once a browser has seen this it refuses plain HTTP for this host until the max-age
    # lapses. That is the point, and it is also a commitment — if the certificate ever fails to
    # renew the site is unreachable rather than merely insecure. One year is the usual figure.
    # Deliberately without `includeSubDomains` and without `preload`: neither can be undone quickly,
    # and this host has nothing beneath it. Browsers ignore this header over plain HTTP, so it
    # costs nothing sitting here before certbot moves it.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cheap, unambiguous hardening for a static site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy, derived from what the app actually loads:
    #   script  its own bundle, plus the inline theme script in index.html, allowed by hash — that
    #           script has to run before first paint, so it cannot move into a file
    #   style   its own CSS, the BPG Boxo stylesheet, and 'unsafe-inline' for the inline style
    #           attributes React sets (the photo track's transform)
    #   font    BPG Boxo, from the same CDN
    #   img     its own assets plus listing photos and seller avatars served by the API
    #   connect the API, and nothing else
    # wa.me, t.me and Google Maps are <a href> navigations, not subresource loads, so they need no
    # directive; the same goes for the redirect out to the bank at checkout.
    #
    # Report-Only on purpose. An enforcing policy that is one directive short white-screens the
    # site, and this one has never been exercised against the real page. Watch the browser console
    # (and the report-uri if you add one) until it is quiet, then rename the header to
    # `Content-Security-Policy` to switch it on.
    #
    # The script hash covers the exact bytes of that inline script — editing it, even by a space,
    # requires recomputing:  openssl dgst -sha256 -binary <script.js> | openssl base64 -A
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-rBQXilZ568aIVgvrqYgFQAbCvhoPUIbX+TexeEgubBY='; style-src 'self' 'unsafe-inline' https://cdn.web-fonts.ge; font-src 'self' data: https://cdn.web-fonts.ge; img-src 'self' data: https://mtabari.com.ge; connect-src 'self' https://mtabari.com.ge; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # The app uses BrowserRouter, so /listing/47 and /checkout/success are client-side routes with
    # no file behind them. Without this fallback they 404 on reload and on any shared link — which
    # includes the address BOG sends a buyer back to after paying.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these, so a given name always holds the same bytes and can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header inside a location replaces the inherited set rather than adding to it, so the
        # security headers have to be repeated here or assets are served without them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # The one file that must not be cached: it names the current hashed bundles, so a stale copy
    # keeps serving the previous deploy long after it is gone.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/market.access.log;
    error_log  /var/log/nginx/market.error.log;
}
