# Shared marketplace config, included by both market server blocks.
# Static files only: the API lives on mtabari.com.ge and is called straight from the browser
# (VITE_API_URL is compiled into the bundle), so nothing is proxied here.
root /var/www/market.mtabari.com.ge;
index index.html;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

include /etc/nginx/snippets/market-sec-headers.conf;

# Vite emits content-hashed filenames under /assets, so they can cache forever.
location /assets/ {
    include /etc/nginx/snippets/market-sec-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# The shell must never be cached, or clients pin an old asset manifest.
location = /index.html {
    include /etc/nginx/snippets/market-sec-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate";
}

# SPA history fallback -- must stay last so it doesn't shadow the routes above.
# /listing/47 and /checkout/success are client-side routes with no file behind them; without this
# they 404 on reload and on every shared link, including the address BOG returns a buyer to.
location / {
    try_files $uri $uri/ /index.html;
}
