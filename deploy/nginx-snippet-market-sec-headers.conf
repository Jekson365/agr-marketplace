# nginx drops inherited add_header directives in any location that declares its own,
# so this must be re-included in every such location -- not just at server level.
# HSTS over plain HTTP is ignored by browsers, so sharing this with the :80 block is safe.
# No includeSubDomains: mtabari.com.ge and its other subdomains are not ours to speak for.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Derived from what the marketplace actually loads: its own bundle plus the inline theme script
# (allowed by hash -- it must run before first paint, so it cannot move to a file), the BPG Boxo
# stylesheet and fonts, listing photos and seller avatars served by the API, and the API itself for
# connect-src. WhatsApp, Telegram, Maps and the bank redirect are navigations, not subresource
# loads, so they need no directive.
#
# Report-Only on purpose: this policy has never been exercised against the live page, and an
# enforcing policy one directive short white-screens the site. Watch the browser console; when it
# is quiet, drop the "-Report-Only" suffix to enforce it.
#
# The hash covers the exact bytes of that inline script. Editing index.html's <script> invalidates
# it: openssl dgst -sha256 -binary script.js | openssl base64 -A
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-rBQXilZ568aIVgvrqYgFQAbCvhoPUIbX+TexeEgubBY='; style-src 'self' 'unsafe-inline' https://cdn.web-fonts.ge; font-src 'self' data: https://cdn.web-fonts.ge; img-src 'self' data: https://mtabari.com.ge; connect-src 'self' https://mtabari.com.ge; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
