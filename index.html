<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ბაზარი</title>
    <script>
      // Applies the stored theme before first paint, so the page never flashes light and then
      // turns dark. Duplicates contexts/theme-context.tsx deliberately — same storage key, same
      // fallback to the OS preference. Keep the two in step.
      (function () {
        try {
          var stored = localStorage.getItem('farm.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          // Storage can be blocked outright; the light default is already correct then.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
